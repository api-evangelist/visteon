  name: Visteon Phoenix SDK
  description: >-
    The Phoenix Software Development Kit provides development tools for building automotive infotainment
    applications targeting Visteon hardware. Phoenix Studio 2.0 is a PC-based IDE that enables app development
    with hardware simulation, device emulation, and the Phoenix API reference integrated into the development
    environment. Apps can be developed once and deployed to any supported Visteon infotainment platform.
