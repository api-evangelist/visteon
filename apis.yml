aid: visteon
name: Visteon
description: >-
  Visteon Corporation is a global automotive electronics supplier providing innovative cockpit electronics products and
  connected car solutions to vehicle manufacturers worldwide. The Visteon Phoenix platform offers a JavaScript API for
  building HTML5-based automotive infotainment applications covering audio control, phone integration, media playback,
  navigation, screen management, remote UI, and vehicle data access. Phoenix Studio enables third-party app development
  targeting Visteon's SmartCore and display audio infotainment systems.
