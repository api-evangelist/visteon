naftiko: 1.0.0-alpha2
info:
  label: Visteon Phoenix API — Phone
  description: 'Visteon Phoenix API — Phone. 4 operations. Lead operation: List Active Calls. Self-contained Naftiko capability
    covering one Visteon business surface.'
  tags:
  - Visteon
  - Phone
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VISTEON_API_KEY: VISTEON_API_KEY
capability:
  consumes:
  - type: http
    namespace: phoenix-phone
    baseUri: https://developer.visteon.com/phoenix/api
    description: Visteon Phoenix API — Phone business capability. Self-contained, no shared references.
    resources:
    - name: phone-calls
      path: /phone/calls
      operations:
      - name: listcalls
        method: GET
        description: List Active Calls
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: makecall
        method: POST
        description: Make Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: phone-calls-callId
      path: /phone/calls/{callId}
      operations:
      - name: endcall
        method: DELETE
        description: End Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: callId
          in: path
          type: string
          description: Identifier of the call to terminate
          required: true
    - name: phone-status
      path: /phone/status
      operations:
      - name: getphonestatus
        method: GET
        description: Get Phone Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Phoenix-API-Key
      value: '{{env.VISTEON_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: phoenix-phone-rest
    port: 8080
    description: REST adapter for Visteon Phoenix API — Phone. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/phone/calls
      name: phone-calls
      description: REST surface for phone-calls.
      operations:
      - method: GET
        name: listcalls
        description: List Active Calls
        call: phoenix-phone.listcalls
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: makecall
        description: Make Call
        call: phoenix-phone.makecall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/phone/calls/{callid}
      name: phone-calls-callid
      description: REST surface for phone-calls-callId.
      operations:
      - method: DELETE
        name: endcall
        description: End Call
        call: phoenix-phone.endcall
        with:
          callId: rest.callId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/phone/status
      name: phone-status
      description: REST surface for phone-status.
      operations:
      - method: GET
        name: getphonestatus
        description: Get Phone Status
        call: phoenix-phone.getphonestatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: phoenix-phone-mcp
    port: 9090
    transport: http
    description: MCP adapter for Visteon Phoenix API — Phone. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-active-calls
      description: List Active Calls
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: phoenix-phone.listcalls
      outputParameters:
      - type: object
        mapping: $.
    - name: make-call
      description: Make Call
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: phoenix-phone.makecall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: end-call
      description: End Call
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: phoenix-phone.endcall
      with:
        callId: tools.callId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-phone-status
      description: Get Phone Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: phoenix-phone.getphonestatus
      outputParameters:
      - type: object
        mapping: $.
