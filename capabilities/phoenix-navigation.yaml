naftiko: 1.0.0-alpha2
info:
  label: Visteon Phoenix API — Navigation
  description: 'Visteon Phoenix API — Navigation. 4 operations. Lead operation: Get Active Route. Self-contained Naftiko capability
    covering one Visteon business surface.'
  tags:
  - Visteon
  - Navigation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VISTEON_API_KEY: VISTEON_API_KEY
capability:
  consumes:
  - type: http
    namespace: phoenix-navigation
    baseUri: https://developer.visteon.com/phoenix/api
    description: Visteon Phoenix API — Navigation business capability. Self-contained, no shared references.
    resources:
    - name: navigation-route
      path: /navigation/route
      operations:
      - name: getactiveroute
        method: GET
        description: Get Active Route
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: startnavigation
        method: POST
        description: Start Navigation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: cancelnavigation
        method: DELETE
        description: Cancel Navigation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: navigation-search
      path: /navigation/search
      operations:
      - name: searchpoi
        method: GET
        description: Search Points of Interest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
          description: Search query string (e.g. "gas station", "restaurant")
          required: true
        - name: lat
          in: query
          type: number
          description: Latitude for search center
        - name: lon
          in: query
          type: number
          description: Longitude for search center
        - name: radius
          in: query
          type: integer
          description: Search radius in meters
    authentication:
      type: apikey
      key: X-Phoenix-API-Key
      value: '{{env.VISTEON_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: phoenix-navigation-rest
    port: 8080
    description: REST adapter for Visteon Phoenix API — Navigation. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/navigation/route
      name: navigation-route
      description: REST surface for navigation-route.
      operations:
      - method: GET
        name: getactiveroute
        description: Get Active Route
        call: phoenix-navigation.getactiveroute
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: startnavigation
        description: Start Navigation
        call: phoenix-navigation.startnavigation
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: cancelnavigation
        description: Cancel Navigation
        call: phoenix-navigation.cancelnavigation
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/navigation/search
      name: navigation-search
      description: REST surface for navigation-search.
      operations:
      - method: GET
        name: searchpoi
        description: Search Points of Interest
        call: phoenix-navigation.searchpoi
        with:
          query: rest.query
          lat: rest.lat
          lon: rest.lon
          radius: rest.radius
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: phoenix-navigation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Visteon Phoenix API — Navigation. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-active-route
      description: Get Active Route
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: phoenix-navigation.getactiveroute
      outputParameters:
      - type: object
        mapping: $.
    - name: start-navigation
      description: Start Navigation
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: phoenix-navigation.startnavigation
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cancel-navigation
      description: Cancel Navigation
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: phoenix-navigation.cancelnavigation
      outputParameters:
      - type: object
        mapping: $.
    - name: search-points-interest
      description: Search Points of Interest
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: phoenix-navigation.searchpoi
      with:
        query: tools.query
        lat: tools.lat
        lon: tools.lon
        radius: tools.radius
      outputParameters:
      - type: object
        mapping: $.
