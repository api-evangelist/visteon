naftiko: "1.0.0-alpha1"

info:
  label: "Visteon Phoenix API"
  description: >-
    Shared capability definition for the Visteon Phoenix automotive infotainment API.
    Provides access to audio, phone, media, navigation, vehicle data, and screen
    management functions on Visteon SmartCore and display audio platforms.
  tags:
    - Audio
    - Automotive
    - Connected Car
    - HMI
    - Infotainment
    - Navigation
    - Vehicle Data
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      VISTEON_PHOENIX_API_KEY: VISTEON_PHOENIX_API_KEY

capability:
  consumes:
    - type: http
      namespace: visteon-phoenix
      baseUri: https://developer.visteon.com/phoenix/api
      description: "Visteon Phoenix automotive infotainment API"
      authentication:
        type: apikey
        key: X-Phoenix-API-Key
        value: "{{VISTEON_PHOENIX_API_KEY}}"
        placement: header
      resources:
        - name: audio
          path: /audio/status
          description: "Audio system status"
          operations:
            - name: get-audio-status
              method: GET
              description: "Get current audio system status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: volume
          path: /audio/volume
          description: "Volume control"
          operations:
            - name: get-volume
              method: GET
              description: "Get current volume level"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: set-volume
              method: PUT
              description: "Set master volume level"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  level: "{{tools.level}}"
                  mute: "{{tools.mute}}"
        - name: audio-sources
          path: /audio/sources
          description: "Audio source management"
          operations:
            - name: list-audio-sources
              method: GET
              description: "List all available audio sources"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: phone
          path: /phone/status
          description: "Phone connection status"
          operations:
            - name: get-phone-status
              method: GET
              description: "Get phone connection and call status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: calls
          path: /phone/calls
          description: "Phone call management"
          operations:
            - name: list-calls
              method: GET
              description: "List active phone calls"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: make-call
              method: POST
              description: "Initiate an outgoing call"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  number: "{{tools.number}}"
        - name: media
          path: /media/library
          description: "Media library browsing"
          operations:
            - name: browse-media-library
              method: GET
              description: "Browse the media library"
              inputParameters:
                - name: type
                  in: query
                  type: string
                  required: false
                  description: "Filter by media type"
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: now-playing
          path: /media/nowplaying
          description: "Currently playing media"
          operations:
            - name: get-now-playing
              method: GET
              description: "Get currently playing track"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: navigation
          path: /navigation/route
          description: "Navigation route management"
          operations:
            - name: get-active-route
              method: GET
              description: "Get the active navigation route"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: start-navigation
              method: POST
              description: "Start navigation to a destination"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  destination: "{{tools.destination}}"
                  avoidTolls: "{{tools.avoidTolls}}"
            - name: cancel-navigation
              method: DELETE
              description: "Cancel the active navigation route"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: poi-search
          path: /navigation/search
          description: "Points of interest search"
          operations:
            - name: search-poi
              method: GET
              description: "Search for points of interest"
              inputParameters:
                - name: query
                  in: query
                  type: string
                  required: true
                  description: "Search query"
                - name: lat
                  in: query
                  type: number
                  required: false
                  description: "Search latitude"
                - name: lon
                  in: query
                  type: number
                  required: false
                  description: "Search longitude"
                - name: radius
                  in: query
                  type: integer
                  required: false
                  description: "Search radius in meters"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: vehicle-data
          path: /vehicle/data
          description: "Vehicle telemetry data"
          operations:
            - name: get-vehicle-data
              method: GET
              description: "Get current vehicle telemetry data"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: displays
          path: /screen/displays
          description: "Display screen management"
          operations:
            - name: list-displays
              method: GET
              description: "List all cockpit display screens"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: visteon-phoenix-rest
      resources:
        - path: /v1/audio/status
          name: audio-status
          description: "Audio system status"
          operations:
            - method: GET
              name: get-audio-status
              description: "Get audio status"
              call: "visteon-phoenix.get-audio-status"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/vehicle/data
          name: vehicle-data
          description: "Vehicle telemetry"
          operations:
            - method: GET
              name: get-vehicle-data
              description: "Get vehicle data"
              call: "visteon-phoenix.get-vehicle-data"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/navigation/route
          name: navigation-route
          description: "Navigation route"
          operations:
            - method: GET
              name: get-active-route
              description: "Get active route"
              call: "visteon-phoenix.get-active-route"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: visteon-phoenix-mcp
      transport: http
      tools:
        - name: get-audio-status
          description: "Get current audio system status"
          hints:
            readOnly: true
            idempotent: true
          call: "visteon-phoenix.get-audio-status"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-vehicle-data
          description: "Get current vehicle telemetry and status data"
          hints:
            readOnly: true
            idempotent: true
          call: "visteon-phoenix.get-vehicle-data"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-active-route
          description: "Get the currently active navigation route"
          hints:
            readOnly: true
            idempotent: true
          call: "visteon-phoenix.get-active-route"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-poi
          description: "Search for points of interest near vehicle location"
          hints:
            readOnly: true
            idempotent: true
          call: "visteon-phoenix.search-poi"
          with:
            query: "tools.query"
            lat: "tools.lat"
            lon: "tools.lon"
            radius: "tools.radius"
          outputParameters:
            - type: object
              mapping: "$."
